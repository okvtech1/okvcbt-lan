<!DOCTYPE html>
<html lang="en"><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OKV CBT - Admin</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<style>
body{background:#f3f5fa;font-family:"Segoe UI",system-ui,Arial,sans-serif}
.side{background:#10213f;min-height:100vh;position:sticky;top:0;height:100vh;overflow:auto}
.side .nav-link{color:#cfd8ee;border-left:3px solid transparent;border-radius:0;text-align:left;padding:.65rem 1.1rem}.side .nav-link:hover{background:rgba(255,255,255,.08)}.side .nav-link.active{background:rgba(255,255,255,.14);color:#fff;border-left-color:#f2a30f}
.brand-mark{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#1b4fd8,#3d7bff);color:#fff;font-weight:800}
.kpi{background:#fff;border:1px solid #e1e7f3;border-left:4px solid #1b4fd8;border-radius:10px;padding:12px 14px;height:100%}.kpi b{display:block;font-size:1.55rem}.kpi span{color:#51607a;font-size:.8rem}
.kpi.g{border-left-color:#14804a}.kpi.a{border-left-color:#f2a30f}.kpi.r{border-left-color:#c62f2f}.kpi.p{border-left-color:#7a4fd8}
.cardx{background:#fff;border:1px solid #e1e7f3;border-radius:12px;padding:16px}.chart{width:100%;height:auto}
.ib{width:30px;height:30px;border:1px solid #dde3ee;background:#fff;border-radius:7px;color:#51607a;margin:0 3px 3px 0;padding:0}.ib:hover{background:#e8eefc;color:#1b4fd8;border-color:#1b4fd8}.ib.red:hover{background:#fde6e6;color:#c62f2f;border-color:#c62f2f}.ib.green:hover{background:#dff5e8;color:#14804a;border-color:#14804a}
.badge-new{background:#c62f2f}.table td,.table th{vertical-align:middle;font-size:.9rem}.acts{white-space:nowrap}
.code{font:700 1rem ui-monospace,Consolas,monospace}.pre{white-space:pre-wrap}
.loginbox{max-width:380px;margin:12vh auto}
#toasts{position:fixed;right:14px;top:14px;z-index:3000;width:340px;max-width:92vw}
@media(max-width:991px){.side{position:static;height:auto;min-height:0}.side .nav{flex-direction:row!important;overflow:auto;flex-wrap:nowrap}.side .nav-link{white-space:nowrap}}
</style></head><body>
<div id="toasts"></div>
<div id="login" class="container"><div class="loginbox cardx shadow-sm"><div class="d-flex align-items-center gap-2 mb-3"><span class="brand-mark">OK</span><div><b>OKV Technology Consults</b><div class="small text-secondary">OKV CBT back office</div></div></div>
<label class="form-label small">Admin password</label><input id="pw" type="password" class="form-control mb-2" autofocus><div id="lerr" class="text-danger small mb-2"></div><button class="btn btn-primary w-100" id="lbtn">Sign in</button>
<div class="small text-secondary mt-3">First time? The starting password is set in Code.gs (INITIAL_ADMIN_PASSWORD). You will be asked to change it.</div></div></div>

<div id="app" class="d-none"><div class="row g-0"><aside class="col-lg-2 side"><div class="d-flex align-items-center gap-2 p-3 text-white"><span class="brand-mark">OK</span><div class="lh-1"><b>OKV CBT</b><small class="d-block opacity-75" style="font-size:.7rem">Admin panel</small></div></div>
<div class="nav flex-lg-column" id="nav"></div><div class="p-3"><button class="btn btn-sm btn-outline-light w-100" onclick="logout()">Sign out</button></div></aside>
<main class="col-lg-10 p-3 p-lg-4"><div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2"><h4 class="mb-0" id="title"></h4>
<div class="d-flex gap-2 align-items-center"><button class="btn btn-outline-secondary position-relative" onclick="go('alerts')" title="Alerts"><i class="bi bi-bell"></i><span id="bell" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger d-none">0</span></button><button class="btn btn-outline-secondary" onclick="go(PAGE)"><i class="bi bi-arrow-clockwise"></i></button></div></div>
<div id="pg"></div></main></div></div>

<div class="modal fade" id="mdl" tabindex="-1"><div class="modal-dialog modal-lg modal-dialog-scrollable"><div class="modal-content"><div class="modal-header"><h5 class="modal-title" id="mt"></h5><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body" id="mb"></div><div class="modal-footer" id="mf"></div></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
var TOKEN=null,PAGE='dash',LASTALERT='',$=function(s,r){return (r||document).querySelector(s)};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function rpc(m){var a=Array.prototype.slice.call(arguments,1);return new Promise(function(ok,no){google.script.run.withSuccessHandler(ok).withFailureHandler(function(e){no(new Error((e&&e.message||String(e)).replace(/^Error:\s*/,'').replace(/^Exception:\s*/,'')))}).adminApi(TOKEN,m,a)})}
function toast(m,t){var d=document.createElement('div');d.className='alert alert-'+(t||'success')+' shadow py-2 mb-2';d.innerHTML=m;$('#toasts').appendChild(d);setTimeout(function(){d.remove()},t==='danger'?6000:3500)}
function fail(e){toast(esc(e.message||e),'danger')}
var MD;function modal(title,body,foot){$('#mt').textContent=title;$('#mb').innerHTML=body;$('#mf').innerHTML=foot||'<button class="btn btn-secondary" data-bs-dismiss="modal">Close</button>';MD=MD||new bootstrap.Modal($('#mdl'));MD.show()}
function closeM(){MD&&MD.hide()}
var fmt=function(i){if(!i)return '';var d=new Date(i);return isNaN(d)?i:d.toLocaleString([], {dateStyle:'medium',timeStyle:'short'})};
var naira=function(n){return '\u20A6'+Number(n||0).toLocaleString('en-NG')};
var PAL=['#1b4fd8','#14804a','#f2a30f','#c62f2f','#7a4fd8','#0aa5b8'];
function bar(d,col){var W=460,H=190,L=34,B=30,T=12,mx=Math.max(1,Math.max.apply(null,d.map(function(x){return x.v})))*1.15,n=Math.max(1,d.length),bw=(W-L-6)/n,g='';[0,.5,1].forEach(function(f){var y=T+(H-T-B)*(1-f);g+='<line x1="'+L+'" x2="'+(W-4)+'" y1="'+y+'" y2="'+y+'" stroke="#e5e9f2"/><text x="'+(L-4)+'" y="'+(y+4)+'" font-size="10" text-anchor="end" fill="#7a869c">'+(Math.round(mx*f)>999?Math.round(mx*f/1000)+'k':Math.round(mx*f))+'</text>'});
 d.forEach(function(x,i){var h=(H-T-B)*x.v/mx,bx=L+i*bw+bw*.18,w=bw*.64,y=T+(H-T-B)-h;g+='<rect x="'+bx+'" y="'+y+'" width="'+w+'" height="'+Math.max(h,0)+'" rx="3" fill="'+(col||'#1b4fd8')+'"/><text x="'+(bx+w/2)+'" y="'+(H-B+14)+'" font-size="9.5" text-anchor="middle" fill="#51607a">'+esc(String(x.l).slice(0,8))+'</text>'});return '<svg class="chart" viewBox="0 0 '+W+' '+H+'">'+g+'</svg>'}
function line(d){var W=460,H=190,L=30,B=26,T=12,n=d.length,mx=Math.max(1,Math.max.apply(null,d.map(function(x){return x.v})))*1.2,px=function(i){return L+i*(W-L-10)/Math.max(1,n-1)},py=function(v){return T+(H-T-B)*(1-v/mx)},g='';[0,.5,1].forEach(function(f){var y=T+(H-T-B)*(1-f);g+='<line x1="'+L+'" x2="'+(W-6)+'" y1="'+y+'" y2="'+y+'" stroke="#e5e9f2"/><text x="'+(L-4)+'" y="'+(y+4)+'" font-size="10" text-anchor="end" fill="#7a869c">'+Math.round(mx*f)+'</text>'});
 g+='<polyline fill="none" stroke="#1b4fd8" stroke-width="2.4" points="'+d.map(function(x,i){return px(i)+','+py(x.v)}).join(' ')+'"/>'+d.map(function(x,i){return '<circle cx="'+px(i)+'" cy="'+py(x.v)+'" r="3.4" fill="#1b4fd8"><title>'+esc(x.l)+': '+x.v+'</title></circle>'+(i%2===0?'<text x="'+px(i)+'" y="'+(H-8)+'" font-size="9.5" text-anchor="middle" fill="#51607a">'+esc(x.l)+'</text>':'')}).join('');return '<svg class="chart" viewBox="0 0 '+W+' '+H+'">'+g+'</svg>'}
function donut(d){var tot=d.reduce(function(a,x){return a+x.v},0);if(!tot)return '<div class="text-secondary p-4 text-center">No data yet</div>';var R=54,r=34,cx=70,cy=70,a0=-Math.PI/2,p='';
 d.forEach(function(x,i){if(!x.v)return;var a1=a0+x.v/tot*2*Math.PI,big=a1-a0>Math.PI?1:0,c=PAL[i%PAL.length];if(x.v===tot)p+='<circle cx="'+cx+'" cy="'+cy+'" r="'+((R+r)/2)+'" fill="none" stroke="'+c+'" stroke-width="'+(R-r)+'"/>';else p+='<path d="M'+(cx+R*Math.cos(a0))+' '+(cy+R*Math.sin(a0))+'A'+R+' '+R+' 0 '+big+' 1 '+(cx+R*Math.cos(a1))+' '+(cy+R*Math.sin(a1))+'L'+(cx+r*Math.cos(a1))+' '+(cy+r*Math.sin(a1))+'A'+r+' '+r+' 0 '+big+' 0 '+(cx+r*Math.cos(a0))+' '+(cy+r*Math.sin(a0))+'Z" fill="'+c+'"/>';a0=a1});
 return '<div class="d-flex align-items-center gap-3 flex-wrap"><svg viewBox="0 0 140 140" width="130" height="130">'+p+'<text x="70" y="75" text-anchor="middle" font-size="20" font-weight="700" fill="#10213f">'+tot+'</text></svg><div class="small">'+d.map(function(x,i){return '<div><i class="d-inline-block rounded-1 me-1" style="width:10px;height:10px;background:'+PAL[i%PAL.length]+'"></i>'+esc(x.l)+': <b>'+x.v+'</b></div>'}).join('')+'</div></div>'}
var kpi=function(l,v,c,sub){return '<div class="col-6 col-md-4 col-xl-2"><div class="kpi '+(c||'')+'"><b>'+v+'</b><span>'+l+'</span>'+(sub?'<div class="small text-secondary">'+sub+'</div>':'')+'</div></div>'};
var ib=function(i,t,oc,c){return '<button class="ib '+(c||'')+'" title="'+esc(t)+'" aria-label="'+esc(t)+'" onclick="'+oc+'"><i class="bi bi-'+i+'"></i></button>'};
var typeBadge=function(t){var m={trial:'info',purchase:'success',activation:'success',installation:'warning',contact:'secondary'};return '<span class="badge text-bg-'+(m[t]||'secondary')+'">'+t+'</span>'};
var stBadge=function(s){var m={New:'danger',Handled:'success',Pending:'warning',Paid:'success',Approved:'success',Rejected:'dark',Failed:'danger',Unused:'secondary',Sent:'primary',Activated:'success',Lead:'secondary',Trial:'info',Paying:'warning',Active:'success'};return '<span class="badge text-bg-'+(m[s]||'secondary')+'">'+esc(s)+'</span>'};
function wa(p,t){p=String(p||'').replace(/\D/g,'').replace(/^0/,'234');return 'https://wa.me/'+p+(t?'?text='+encodeURIComponent(t):'')}
function csv(rows,name){var t=rows.map(function(r){return r.map(function(c){return '"'+String(c==null?'':c).replace(/"/g,'""')+'"'}).join(',')}).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+t],{type:'text/csv'}));a.download=name;document.body.appendChild(a);a.click();a.remove()}
var NAV=[['dash','speedometer2','Overview'],['subs','inbox','Submissions'],['custs','people','Customers'],['pays','cash-coin','Payments'],['codes','key','Activation codes'],['msgs','chat-dots','Messages'],['alerts','bell','Alerts'],['settings','sliders','Settings & integrations'],['tools','tools','Tools']];
function buildNav(){$('#nav').innerHTML=NAV.map(function(n){return '<a class="nav-link" href="#" data-p="'+n[0]+'" onclick="go(\''+n[0]+'\');return false"><i class="bi bi-'+n[1]+' me-2"></i>'+n[2]+'</a>'}).join('')}
function go(p){PAGE=p;document.querySelectorAll('#nav .nav-link').forEach(function(a){a.classList.toggle('active',a.dataset.p===p)});$('#title').textContent=NAV.filter(function(n){return n[0]===p})[0][2];$('#pg').innerHTML='<div class="text-center p-5"><div class="spinner-border text-primary"></div></div>';(PAGES[p]||PAGES.dash)().catch(function(e){$('#pg').innerHTML='<div class="alert alert-danger">'+esc(e.message)+'</div>'})}

/* ---- auth ---- */
$('#lbtn').onclick=function(){var b=this;b.disabled=true;$('#lerr').textContent='';google.script.run.withSuccessHandler(function(r){TOKEN=r.token;$('#login').classList.add('d-none');$('#app').classList.remove('d-none');buildNav();go('dash');poll();if(r.must_change)setTimeout(pwModal,500)}).withFailureHandler(function(e){b.disabled=false;$('#lerr').textContent=(e.message||String(e)).replace(/^Error:\s*/,'')}).adminLogin($('#pw').value)};
$('#pw').addEventListener('keydown',function(e){if(e.key==='Enter')$('#lbtn').click()});
function logout(){TOKEN=null;location.reload()}
function pwModal(){modal('Change admin password','<p class="text-secondary small">Use at least 8 characters.</p><input id="o" type="password" class="form-control mb-2" placeholder="Current password"><input id="n" type="password" class="form-control" placeholder="New password">','<button class="btn btn-primary" onclick="rpc(\'changePassword\',$(\'#o\').value,$(\'#n\').value).then(function(){closeM();toast(\'Password changed\')}).catch(fail)">Change</button>')}
function poll(){setInterval(function(){if(!TOKEN)return;rpc('getAlerts',LASTALERT).then(function(r){var b=$('#bell');b.textContent=r.unread;b.classList.toggle('d-none',!r.unread);if(r.alerts.length){if(LASTALERT)r.alerts.forEach(function(a){toast('<b>'+esc(a.title)+'</b>','warning')});LASTALERT=r.alerts[r.alerts.length-1].id;if(LASTALERT&&PAGE==='dash')go('dash')}}).catch(function(){})},30000);rpc('getAlerts','').then(function(r){var b=$('#bell');b.textContent=r.unread;b.classList.toggle('d-none',!r.unread);if(r.alerts.length)LASTALERT=r.alerts[r.alerts.length-1].id}).catch(function(){})}

var PAGES={};
/* ---- overview ---- */
PAGES.dash=async function(){var s=await rpc('stats');
 $('#pg').innerHTML='<div class="row g-3 mb-3">'+kpi('New submissions',s.fresh,s.fresh?'r':'')+kpi('Free trials',s.trial,'p')+kpi('Purchases',s.purchase,'g')+kpi('Installation requests',s.installation,'a')+kpi('Contact messages',s.contact)+kpi('Revenue',naira(s.revenue),'g')+'</div>'
 +'<div class="row g-3 mb-3">'+kpi('Pending payments',s.pendingPay,s.pendingPay?'r':'')+kpi('Codes unused',s.codes.unused,'g','of '+s.codes.total)+kpi('Codes sent',s.codes.sent,'p')+kpi('Codes activated',s.codes.activated,'g')+kpi('Customers',s.customers)+kpi('Active licences',s.active,'g')+'</div>'
 +(s.pendingList&&s.pendingList.length?'<div class="cardx mb-3" style="border-color:#f2a30f"><h6><i class="bi bi-hourglass-split"></i> Payments waiting for your approval</h6>'+s.pendingList.map(function(p){return '<div class="d-flex flex-wrap justify-content-between align-items-center border-bottom py-2 gap-2"><div><b>'+esc(p.school||p.name)+'</b> <span class="text-secondary small">'+esc(p.email)+' &middot; '+naira(p.amount)+' &middot; '+fmt(p.time)+'</span></div><div class="d-flex gap-2">'+(p.raw&&p.raw.indexOf('http')===0?'<a class="btn btn-sm btn-outline-secondary" target="_blank" href="'+esc(p.raw)+'">View receipt</a>':'')+'<button class="btn btn-sm btn-success" onclick="quickApprove(\''+p.id+'\')"><i class="bi bi-check-lg"></i> Approve &amp; send code</button></div></div>'}).join('')+'</div>':'')
 +'<div class="row g-3 mb-3"><div class="col-lg-6"><div class="cardx"><h6>Submissions - last 14 days</h6>'+line(s.days)+'</div></div><div class="col-lg-3"><div class="cardx h-100"><h6>Customers by status</h6>'+donut(s.custBy)+'</div></div><div class="col-lg-3"><div class="cardx h-100"><h6>Activation code pool</h6>'+donut([{l:'Unused',v:s.codes.unused},{l:'Sent',v:s.codes.sent},{l:'Activated',v:s.codes.activated}])+(s.codes.unused<100?'<div class="alert alert-warning mt-2 py-1 small mb-0">Low on codes. Generate more.</div>':'')+'</div></div></div>'
 +'<div class="row g-3"><div class="col-lg-6"><div class="cardx"><h6>Revenue - last 6 months</h6>'+bar(s.months,'#14804a')+'</div></div><div class="col-lg-6"><div class="cardx"><h6>Latest alerts</h6>'+(s.recent.map(function(a){return '<div class="border-bottom py-2"><b>'+esc(a.title)+'</b><div class="small text-secondary">'+fmt(a.time)+'</div></div>'}).join('')||'<div class="text-secondary">Nothing yet.</div>')+'</div></div></div>'};
function quickApprove(id){if(!confirm('Approve this payment and email the activation code to the customer now?'))return;rpc('approvePayment',id).then(function(r){toast('Code '+r.code+' sent');go('dash')}).catch(fail)}
/* ---- submissions ---- */
var SF={type:'',status:'',q:''};
PAGES.subs=async function(){var r=await rpc('listSubmissions',SF);window._s=r;
 $('#pg').innerHTML='<div class="cardx"><div class="d-flex gap-2 flex-wrap mb-3"><select id="ft" class="form-select w-auto"><option value="">All types</option>'+['trial','purchase','activation','installation','contact'].map(function(t){return '<option '+(SF.type===t?'selected':'')+'>'+t+'</option>'}).join('')+'</select><select id="fs" class="form-select w-auto"><option value="">All status</option><option '+(SF.status==='New'?'selected':'')+'>New</option><option '+(SF.status==='Handled'?'selected':'')+'>Handled</option></select><input id="fq" class="form-control w-auto" placeholder="Search" value="'+esc(SF.q)+'"><button class="btn btn-outline-secondary" onclick="exportSubs()"><i class="bi bi-download"></i> CSV</button></div>'
 +'<div class="table-responsive"><table class="table table-hover"><thead><tr><th>Time</th><th>Type</th><th>Name / organisation</th><th>Email</th><th>Phone</th><th>Status</th><th>Actions</th></tr></thead><tbody>'+(r.map(function(s,i){return '<tr><td>'+fmt(s.time)+'</td><td>'+typeBadge(s.type)+'</td><td><b>'+esc(s.name)+'</b><div class="small text-secondary">'+esc(s.school)+'</div></td><td>'+esc(s.email)+'</td><td>'+esc(s.phone)+'</td><td>'+stBadge(s.status)+(s.code?'<div class="code small">'+esc(s.code)+'</div>':'')+'</td><td class="acts">'+ib('eye','View','viewSub('+i+')')+(s.type==='purchase'||s.type==='activation'?ib('check-lg','Approve & send activation code','sendCodeSub('+i+')','green'):'')+ib('envelope','Email','mailTo(\''+esc(s.email)+'\',\''+esc(s.name)+'\')')+(s.phone?'<a class="ib d-inline-flex align-items-center justify-content-center text-decoration-none" title="WhatsApp" target="_blank" href="'+wa(s.phone)+'"><i class="bi bi-whatsapp"></i></a>':'')+ib('check2','Mark handled','markSub('+i+')','green')+ib('trash','Delete','delSub('+i+')','red')+'</td></tr>'}).join('')||'<tr><td colspan="7" class="text-center text-secondary p-4">No submissions.</td></tr>')+'</tbody></table></div></div>';
 $('#ft').onchange=function(){SF.type=this.value;go('subs')};$('#fs').onchange=function(){SF.status=this.value;go('subs')};$('#fq').onchange=function(){SF.q=this.value;go('subs')}};
function viewSub(i){var s=window._s[i],det={};try{det=JSON.parse(s.details||'{}')}catch(e){}
 modal(s.type.toUpperCase()+' - '+(s.school||s.name),'<table class="table table-sm"><tbody>'+[['Time',fmt(s.time)],['Name',s.name],['Organisation',s.school],['Email',s.email],['Phone',s.phone],['Source',s.source],['Amount',s.amount?naira(s.amount):''],['Reference',s.pay_ref],['Payment date',s.pay_date],['Install ID',s.install_id],['Method',s.method],['Code sent',s.code]].filter(function(r){return r[1]}).map(function(r){return '<tr><th class="w-25">'+r[0]+'</th><td>'+esc(r[1])+'</td></tr>'}).join('')+Object.keys(det).filter(function(k){return det[k]}).map(function(k){return '<tr><th>'+esc(k)+'</th><td class="pre">'+esc(det[k])+'</td></tr>'}).join('')+'</tbody></table>'+(s.receipt_url?'<a class="btn btn-outline-primary btn-sm" target="_blank" href="'+esc(s.receipt_url)+'"><i class="bi bi-receipt"></i> Open payment receipt</a>':'')+'<label class="form-label small mt-3">Notes</label><textarea id="nt" class="form-control" rows="2">'+esc(s.notes)+'</textarea>',
 '<button class="btn btn-primary" onclick="rpc(\'updateSubmission\',\''+s.id+'\',{notes:$(\'#nt\').value}).then(function(){closeM();toast(\'Saved\')}).catch(fail)">Save notes</button><button class="btn btn-secondary" data-bs-dismiss="modal">Close</button>')}
function markSub(i){rpc('updateSubmission',window._s[i].id,{status:'Handled'}).then(function(){go('subs')}).catch(fail)}
function delSub(i){if(confirm('Delete this submission?'))rpc('deleteSubmission',window._s[i].id).then(function(){go('subs')}).catch(fail)}
function sendCodeSub(i){var s=window._s[i];if(!confirm('Approve and email the next activation code to '+s.email+' now?'))return;rpc('approveAndSend',s.id).then(function(r){toast('Code '+r.code+' '+(r.emailed?'emailed to '+esc(s.email):'created but email failed'));go('subs')}).catch(fail)}
function exportSubs(){rpc('exportSubmissions').then(function(r){csv([['id','time','type','status','name','school','email','phone','source','amount','pay_ref','pay_date','install_id','method','receipt_url','code','notes']].concat(r.map(function(x){return x}) ),'okv_submissions.csv')}).catch(fail)}
function mailTo(email,name){modal('Email '+(name||email),'<input id="me" class="form-control mb-2" value="'+esc(email)+'"><input id="msb" class="form-control mb-2" placeholder="Subject"><textarea id="mbd" class="form-control" rows="7" placeholder="Message">Hello '+esc(name||'')+',\n\n\n\nOKV Technology Consults</textarea>','<button class="btn btn-primary" onclick="rpc(\'sendMessage\',{channel:\'email\',audience:\'custom\',emails:$(\'#me\').value,subject:$(\'#msb\').value,body:$(\'#mbd\').value}).then(function(r){closeM();toast(\'Sent\')}).catch(fail)"><i class="bi bi-send"></i> Send</button>')}
/* ---- customers ---- */
var CQ='';
PAGES.custs=async function(){var r=await rpc('listCustomers',CQ);window._c=r;
